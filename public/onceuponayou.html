<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6B5BD2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Once Upon a You">
<title>Once Upon a You</title>
<style>
  :root{ --ink:#3A3550; --violet:#6B5BD2; --gold:#F4C04A; --card:#FFFFFF; --panel:#F7F5FF; --accent:#7FC889; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  html,body{margin:0; height:100%; overflow:hidden; touch-action:manipulation}
  body{ font-family:"SF Pro Rounded","Segoe UI Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%, #F3EFFF 0%, #EAF6FB 55%, #E5F3EC 100%); }
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center}
  svg.scene-svg{display:block; width:100%; height:100%}
  /* purely-decorative SVG layers must NEVER intercept taps — only #activity, #props, #companionWrap and #tapLayer are interactive */
  #fx,#banner,#ambient,#stars,#clouds,#signpost,#bloom0,#bloom1,#bloom2,#avatarWrap,#placeSchool,#placePlayground,#placeHouse{pointer-events:none}
  /* travel bar (place picker) — big iconic buttons a non-reader can use; bottom-centre, clear of other tools */
  #places{position:fixed; left:max(46px,calc(env(safe-area-inset-left) + 46px)); top:max(12px,env(safe-area-inset-top)); display:flex; gap:9px; z-index:21}
  .travel{width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; font-size:23px; line-height:1; background:rgba(255,255,255,.86); box-shadow:0 5px 16px rgba(70,55,110,.18); display:flex; align-items:center; justify-content:center; transition:transform .12s, box-shadow .12s}
  .travel:active{transform:scale(.9)}
  .travel.sel{box-shadow:0 0 0 3px var(--violet), 0 5px 16px rgba(70,55,110,.18); transform:scale(1.1); background:#fff}
  /* kid liveliness + equipment motion (CSS = cheap, off the JS thread) */
  @keyframes kbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .kidbob{animation:kbob 2.6s ease-in-out infinite}
  @keyframes swingRock{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
  /* glowing ring on a selected playground friend + clearer touch feedback */
  @keyframes selpulse{0%,100%{opacity:.5}50%{opacity:1}}
  .selring{animation:selpulse 1.1s ease-in-out infinite}
  /* speech bubble */
  #say{position:fixed; left:50%; transform:translateX(-50%); top:max(10px,env(safe-area-inset-top)); max-width:88vw;
    background:rgba(255,255,255,.94); color:var(--ink); font-weight:700; font-size:clamp(15px,4.2vw,20px); line-height:1.25;
    padding:11px 18px; border-radius:18px; box-shadow:0 8px 26px rgba(70,55,110,.2); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:20; text-align:center}
  #say.show{opacity:1}
  /* tools */
  .tool{position:fixed; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; z-index:21;
    background:rgba(255,255,255,.86); box-shadow:0 5px 16px rgba(70,55,110,.18); font-size:22px; display:flex; align-items:center; justify-content:center}
  .tool:active{transform:scale(.92)}
  #playAgain{right:max(12px,env(safe-area-inset-right)); bottom:max(14px,env(safe-area-inset-bottom)); width:58px;height:58px; font-size:28px;
    background:radial-gradient(circle at 38% 32%,#fff,#ffe9b8 70%,var(--gold))}
  #muteDot{right:max(12px,env(safe-area-inset-right)); top:max(12px,env(safe-area-inset-top))}
  #gAnchor{position:fixed; left:0; top:0; width:34px; height:34px; z-index:22; background:transparent}
  /* overlays */
  .overlay{position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:16px;
    background:radial-gradient(120% 120% at 50% 0%, #F3EFFF 0%, #EAF6FB 55%, #E5F3EC 100%)}
  .overlay.dim{background:rgba(58,53,80,.42); backdrop-filter:blur(3px)}
  .overlay.show{display:flex}
  .card{width:100%; max-width:460px; background:var(--card); border-radius:26px; padding:18px 18px 20px; box-shadow:0 18px 50px rgba(70,55,110,.22); text-align:center; max-height:94vh; overflow:auto}
  .card h2{margin:4px 0 8px; color:var(--violet); font-size:22px; font-weight:800}
  .scene-mini{background:linear-gradient(#EAF7FC,#E5F3EC); border-radius:20px; margin-bottom:8px}
  .opts{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin:6px 0}
  .row{display:flex; align-items:center; gap:10px; margin:8px 2px; justify-content:center}
  .row .label{width:66px; flex:0 0 66px; text-align:right; font-weight:700; font-size:13px; color:#6f6a85}
  .sw{width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.06); transition:transform .12s}
  .sw:active{transform:scale(.9)} .sw.sel{box-shadow:0 0 0 3px var(--violet); transform:scale(1.08)}
  .pill{border:none; background:var(--panel); color:#5b5676; font-weight:700; font-size:13px; padding:8px 13px; border-radius:13px; cursor:pointer; font-family:inherit; transition:transform .12s}
  .pill:active{transform:scale(.94)} .pill.sel{background:var(--violet); color:#fff}
  .big-pick{display:inline-flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:8px; border-radius:18px; transition:transform .12s; background:var(--panel)}
  .big-pick.sel{box-shadow:0 0 0 4px var(--violet); transform:scale(1.05); background:#fff}
  .big-pick:active{transform:scale(.96)}
  .colorblob{width:54px; height:54px; border-radius:50%; cursor:pointer; border:4px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.12); transition:transform .12s}
  .colorblob.sel{box-shadow:0 0 0 5px var(--violet); transform:scale(1.08)} .colorblob:active{transform:scale(.94)}
  .nameField input{width:100%; font-family:inherit; font-weight:800; font-size:20px; color:var(--ink); padding:13px 14px; border:2px solid #ece8fb; border-radius:14px; background:#fbfaff; outline:none; text-align:center; margin:4px 0}
  .nameField input:focus{border-color:var(--violet)}
  .sub{font-size:13px; color:#9b96ad; margin:4px 4px}
  .micro{font-size:11px; color:#bdb8cf; margin-top:8px}
  .go{margin-top:12px; border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:17px; color:#fff; padding:13px 26px; border-radius:16px;
    background:linear-gradient(135deg,var(--violet),#8a7be0); box-shadow:0 8px 22px rgba(107,91,210,.4)}
  .go:disabled{opacity:.4} .go:active{transform:scale(.96)}
  .gnum{width:64px;height:64px;border-radius:18px;border:none;background:var(--panel);font-size:30px;font-weight:800;color:var(--violet);cursor:pointer;margin:6px}
  .gnum:active{transform:scale(.94)}
  .grow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px;font-weight:700;font-size:14px;color:#5b5676}
  .toggle{width:52px;height:30px;border-radius:15px;background:#ddd6f2;position:relative;cursor:pointer;flex:0 0 52px}
  .toggle.on{background:var(--accent)} .toggle .kn{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s} .toggle.on .kn{left:25px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
  #fallbackCap{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;font-size:15px;padding:9px 16px;border-radius:14px;box-shadow:0 6px 18px rgba(70,55,110,.18);display:none;z-index:19;max-width:88vw;text-align:center}
</style>
</head>
<body>

<!-- ============ PLAY STAGE ============ -->
<div id="stage">
  <svg id="scene" class="scene-svg" viewBox="0 0 480 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A magical meadow">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="skyTop" offset="0" stop-color="#C3E7F8"/><stop offset="1" stop-color="#EAF7FC"/></linearGradient>
      <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BCE595"/><stop offset="1" stop-color="#98CE6F"/></linearGradient>
      <clipPath id="shirtClip"><rect x="78" y="150" width="64" height="58" rx="24"/></clipPath>
      <radialGradient id="bloomGlow"><stop offset="0" stop-color="#FFF3C0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3C0" stop-opacity="0"/></radialGradient>
    </defs>
    <rect id="skyRect" x="0" y="0" width="480" height="210" fill="url(#sky)"/>
    <circle id="sun" cx="46" cy="46" r="30" fill="#FBE08A" opacity=".35"/><circle cx="46" cy="46" r="21" fill="#FBDE7E"/>
    <g id="clouds" fill="#FFFFFF" opacity=".92"><ellipse cx="372" cy="42" rx="26" ry="13"/><ellipse cx="392" cy="48" rx="20" ry="11"/><ellipse cx="354" cy="50" rx="16" ry="9"/></g>
    <g id="stars" opacity="0"></g>
    <path id="grassPath" d="M0,196 C120,180 220,202 320,190 C400,181 450,198 480,188 L480,340 L0,340 Z" fill="url(#grass)"/>
    <!-- progress blooms (start as closed buds) -->
    <g id="bloom0" transform="translate(60,150)"></g>
    <g id="bloom1" transform="translate(240,128)"></g>
    <g id="bloom2" transform="translate(420,150)"></g>
    <g id="ambient"></g>            <!-- butterflies, birds, daily-delight extras -->
    <g id="signpost"></g>          <!-- planted name signpost -->
    <g id="placePlayground" style="display:none"></g>  <!-- playground decor: equipment + kid NPCs (decorative; taps handled by #props above) -->
    <g id="placeSchool" style="display:none"></g>      <!-- school decor: schoolhouse, chalkboard, desks + classmate NPCs -->
    <g id="placeHouse" style="display:none"></g>       <!-- cozy home interior: window, sofa, bookshelf, toy chest, lamp, pet bed -->
    <rect id="tapLayer" x="0" y="0" width="480" height="340" fill="transparent"/> <!-- tap-to-walk base: sits BELOW activity/props so letter & object taps register; empty grass taps fall through to here -->
    <g id="props"></g>             <!-- interactive tap pads (kids/equipment/desks); persists across clearActivity() -->
    <g id="activity"></g>          <!-- activity targets live here -->
    <g id="banner"></g>            <!-- treasure / count / name ribbon -->
    <!-- shadows + companion + avatar -->
    <ellipse id="compShadow" cx="0" cy="0" rx="26" ry="6" fill="#000" opacity=".07"/>
    <ellipse id="avShadow" cx="0" cy="0" rx="34" ry="7" fill="#000" opacity=".08"/>
    <g id="companionWrap"><g id="companion"></g></g>
    <g id="avatarWrap"><g id="avatar"></g></g>
    <g id="fx"></g>                 <!-- walk sparkle, particles -->
  </svg>
</div>

<div id="say"></div>
<div id="fallbackCap"></div>
<button class="tool" id="muteDot" title="Sound">🔊</button>
<button class="tool" id="playAgain" title="Play">✨</button>
<div id="gAnchor"></div>
<div id="places">
  <button class="travel sel" data-place="meadow" aria-label="Go to the meadow">🌳</button>
  <button class="travel" data-place="house" aria-label="Go to the house">🏠</button>
  <button class="travel" data-place="playground" aria-label="Go to the playground">🛝</button>
  <button class="travel" data-place="school" aria-label="Go to school">🏫</button>
</div>

<!-- ============ SETUP ============ -->
<div class="overlay" id="setup">
  <div class="card" id="setupCard"></div>
</div>

<!-- ============ GROWN-UP GATE + CORNER ============ -->
<div class="overlay dim" id="gate">
  <div class="card" style="max-width:360px">
    <h2>Are you a grown-up?</h2>
    <div class="sub">Tap the number <b id="gateTarget">3</b></div>
    <div id="gateNums" style="margin:10px 0"></div>
  </div>
</div>
<div class="overlay dim" id="grownup">
  <div class="card" style="text-align:left">
    <h2 style="text-align:center">🌸 Grown-Up Corner</h2>
    <div class="grow"><span>Age (sets the gentle pace)</span><div class="opts" id="gAge"></div></div>
    <div class="grow"><span>Talking speed</span><div class="opts" id="gPace"></div></div>
    <div class="grow"><span>Mute learning talk only</span><div class="toggle" id="gMute"><div class="kn"></div></div></div>
    <div class="grow"><span>Sleepy time after</span><div class="opts" id="gWind"></div></div>
    <button class="pill" id="gShare" style="width:100%;margin:6px 0;background:var(--violet);color:#fff">✨ Show someone this Meadow</button>
    <button class="pill" id="gWindNow" style="width:100%;margin:6px 0">🌙 Start sleepy time now</button>
    <div class="micro" style="text-align:center">Everything stays on this tablet — no accounts, nothing leaves the device.</div>
    <div style="text-align:center"><button class="pill" id="gReset" style="margin-top:8px;color:#c25">Start over</button>
      <button class="go" id="gClose" style="margin-left:8px">Done</button></div>
  </div>
</div>

<script>
/* ============================================================
   ONCE UPON A YOU — personalized no-fail learning meadow.
   One file, vanilla JS + inline SVG. Generate-at-setup, then offline.
   No backend, no SDKs, no PII off device. No fail states.
   Avatar/companion art reused verbatim from the character-builder demo.
   ============================================================ */

/* ---------- demo constants + art (VERBATIM) ---------- */
const skins=["#FAD9C1","#F0C5A4","#E0AC85","#C68B62","#A6754F","#7D5638"];
const eyeCols=["#5B3A1E","#2E2620","#4F86C6","#5BA678","#B07A2E"];
const hairCs=["#2E2520","#6B4324","#C98A3A","#101012","#E7B85A","#B65C3E"];
const shirts=["#5BAEDC","#F47C7C","#7FC889","#F4B94B","#A98BD6","#EF8FB8"];
const colorWords=["Blue","Red","Green","Yellow","Purple","Pink"];
const hairStyles=["Short","Buzz","Curly","Puffs","Long","Ponytail","Braids","Bun"];
const outfits=["Tee","Stripes","Star","Overalls","Dress"];
const glassesOpt=["None","Round","Square"];
const freckOpt=["None","Freckles"];
const headOpt=["None","Bow","Band"];
const pets=["Bunny","Fox","Cat","Puppy"];
const friendName={Bunny:"Pip",Fox:"Sunny",Cat:"Mittens",Puppy:"Biscuit"};
const pick=a=>a[Math.floor(Math.random()*a.length)];

function dome(c){return `<path d="M56,108 C52,62 82,46 110,46 C138,46 168,62 164,108 C150,92 130,86 110,86 C90,86 70,92 56,108 Z" fill="${c}"/>`;}
function hair(style,c){
  if(style==="Short")return dome(c);
  if(style==="Buzz")return `<path d="M62,98 C62,66 86,52 110,52 C134,52 158,66 158,98 C150,90 130,88 110,88 C90,88 70,90 62,98 Z" fill="${c}" opacity=".96"/>`;
  if(style==="Curly")return [[80,62,20],[110,52,22],[140,62,20],[158,86,17],[62,86,17],[96,50,18],[124,50,18],[58,106,14],[162,106,14]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join("");
  if(style==="Puffs")return dome(c)+`<circle cx="78" cy="50" r="16" fill="${c}"/><circle cx="142" cy="50" r="16" fill="${c}"/>`;
  if(style==="Long")return dome(c)+`<path d="M58,98 C44,122 46,156 54,178 C62,184 75,182 79,168 C77,142 75,120 77,100 C71,104 64,102 58,98 Z" fill="${c}"/><path d="M162,98 C176,122 174,156 166,178 C158,184 145,182 141,168 C143,142 145,120 143,100 C149,104 156,102 162,98 Z" fill="${c}"/>`;
  if(style==="Ponytail")return dome(c)+`<path d="M158,92 C184,88 196,110 188,134 C182,152 168,150 162,136 C160,120 158,106 158,92 Z" fill="${c}"/><ellipse cx="159" cy="98" rx="7" ry="5" fill="#000" opacity=".12"/>`;
  if(style==="Braids")return dome(c)+[[60,120,9],[58,138,9],[56,156,8],[160,120,9],[162,138,9],[164,156,8]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join("")+`<circle cx="55" cy="166" r="3" fill="#000" opacity=".12"/><circle cx="165" cy="166" r="3" fill="#000" opacity=".12"/>`;
  return `<circle cx="110" cy="40" r="18" fill="${c}"/><ellipse cx="110" cy="58" rx="13" ry="6" fill="${c}" opacity=".75"/>`+dome(c);
}
function headwear(k){
  if(k==="Bow")return `<g><path d="M84,52 L70,45 L70,59 Z" fill="#F47C7C"/><path d="M84,52 L98,45 L98,59 Z" fill="#F47C7C"/><circle cx="84" cy="52" r="4" fill="#E25C5C"/></g>`;
  if(k==="Band")return `<path d="M66,94 Q110,76 154,94" fill="none" stroke="#EFA0C4" stroke-width="8" stroke-linecap="round"/>`;
  return "";
}
function eyes(ec){return `<ellipse cx="93" cy="108" rx="8" ry="10" fill="#fff"/><ellipse cx="127" cy="108" rx="8" ry="10" fill="#fff"/><circle cx="94" cy="109" r="5" fill="${ec}"/><circle cx="128" cy="109" r="5" fill="${ec}"/><circle cx="94" cy="110" r="2.4" fill="#241F1B"/><circle cx="128" cy="110" r="2.4" fill="#241F1B"/><circle cx="96" cy="106.5" r="1.7" fill="#fff"/><circle cx="130" cy="106.5" r="1.7" fill="#fff"/>`;}
function freckles(on){if(on!=="Freckles")return ""; return [[88,122],[94,124],[100,122],[120,122],[126,124],[132,122],[108,121],[112,121]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.3" fill="#B5764C" opacity=".6"/>`).join("");}
function glasses(s){if(s==="None")return ""; const f="#4A4660", tint='fill="#fff" fill-opacity=".12"';
  const bridge=`<path d="M101,107 q9,-3 18,0" fill="none" stroke="${f}" stroke-width="3" stroke-linecap="round"/>`;
  const arms=`<line x1="81" y1="107" x2="60" y2="108" stroke="${f}" stroke-width="3" stroke-linecap="round"/><line x1="139" y1="107" x2="160" y2="108" stroke="${f}" stroke-width="3" stroke-linecap="round"/>`;
  if(s==="Round")return `<circle cx="93" cy="108" r="12" ${tint} stroke="${f}" stroke-width="3"/><circle cx="127" cy="108" r="12" ${tint} stroke="${f}" stroke-width="3"/>${bridge}${arms}`;
  return `<rect x="81" y="97" width="24" height="22" rx="6" ${tint} stroke="${f}" stroke-width="3"/><rect x="115" y="97" width="24" height="22" rx="6" ${tint} stroke="${f}" stroke-width="3"/>${bridge}${arms}`;
}
function torso(style,c){const collar=`<path d="M88,151 q22,16 44,0 v6 q-22,15 -44,0 Z" fill="#000" opacity=".05"/>`;
  if(style==="Tee")return `<rect x="78" y="150" width="64" height="58" rx="24" fill="${c}"/>${collar}`;
  if(style==="Stripes")return `<rect x="78" y="150" width="64" height="58" rx="24" fill="${c}"/><g clip-path="url(#shirtClip)" fill="#fff" opacity=".82"><rect x="78" y="162" width="64" height="7"/><rect x="78" y="178" width="64" height="7"/><rect x="78" y="194" width="64" height="7"/></g>${collar}`;
  if(style==="Star")return `<rect x="78" y="150" width="64" height="58" rx="24" fill="${c}"/><path d="M110,166 l4.7,9.5 10.5,1.5 -7.6,7.4 1.8,10.4 -9.4,-4.9 -9.4,4.9 1.8,-10.4 -7.6,-7.4 10.5,-1.5 Z" fill="#FBE08A"/>${collar}`;
  if(style==="Overalls")return `<rect x="78" y="150" width="64" height="58" rx="24" fill="#EFEDFA"/><rect x="90" y="150" width="7" height="24" rx="3" fill="${c}"/><rect x="123" y="150" width="7" height="24" rx="3" fill="${c}"/><path d="M86,170 h48 v38 q-24,12 -48,0 Z" fill="${c}"/><rect x="100" y="182" width="20" height="15" rx="3" fill="#000" opacity=".08"/><circle cx="93" cy="173" r="2.2" fill="#FBE08A"/><circle cx="127" cy="173" r="2.2" fill="#FBE08A"/>${collar}`;
  return `<path d="M84,156 q26,-12 52,0 l13,58 q-39,16 -78,0 Z" fill="${c}"/>${collar}`;
}
function avatar(s){const sk=s.skin; return `
  <rect x="96" y="198" width="12" height="30" rx="6" fill="${sk}"/><rect x="112" y="198" width="12" height="30" rx="6" fill="${sk}"/>
  <rect x="90" y="222" width="20" height="14" rx="6" fill="#6B5BD2"/><rect x="110" y="222" width="20" height="14" rx="6" fill="#6B5BD2"/>
  ${torso(s.outfit,s.shirt)}
  <g transform="rotate(9 80 160)"><rect x="73" y="156" width="14" height="46" rx="7" fill="${sk}"/></g>
  <g transform="rotate(-9 152 160)"><rect x="145" y="156" width="14" height="46" rx="7" fill="${sk}"/></g>
  <circle cx="72" cy="201" r="9" fill="${sk}"/><circle cx="148" cy="201" r="9" fill="${sk}"/>
  <circle cx="58" cy="108" r="9" fill="${sk}"/><circle cx="162" cy="108" r="9" fill="${sk}"/>
  <circle cx="110" cy="104" r="54" fill="${sk}"/>
  <ellipse cx="110" cy="150" rx="40" ry="14" fill="#000" opacity=".04"/>
  <circle cx="80" cy="124" r="8" fill="#F7A8A8" opacity=".7"/><circle cx="140" cy="124" r="8" fill="#F7A8A8" opacity=".7"/>
  ${eyes(s.eye)}${freckles(s.freckles)}
  <path d="M99,128 Q110,138 121,128" fill="none" stroke="#B5635A" stroke-width="3" stroke-linecap="round"/>
  ${glasses(s.glasses)}${hair(s.hairStyle,s.hairColor)}${headwear(s.headwear)}`;
}
function companion(kind){const T='transform="translate(60,4)"';
  if(kind==="Bunny"){const c="#EFEFEF",st='stroke="#DADADA" stroke-width="1"';

/* ---------- audio (Web Audio synth, warm) ---------- */
let AC=null,master=null,filter=null;
function initAudio(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); filter=AC.createBiquadFilter(); filter.type="lowpass"; filter.frequency.value=3200;
  master=AC.createGain(); master.gain.value=0.9; filter.connect(master); master.connect(AC.destination);}catch(e){} }
let soundOn=true;
function tone(f,d,type,v,delay){ if(!AC||!soundOn)return; const o=AC.createOscillator(),g=AC.createGain(),st=AC.currentTime+(delay||0);
  o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(v||.12,st+.03); g.gain.exponentialRampToValueAtTime(.0001,st+d);
  o.connect(g); g.connect(filter); o.start(st); o.stop(st+d+.05); }
function chimeUp(){ [262,330,392].forEach((f,i)=>tone(f,.3,"sine",.12,i*.07)); }
function boop(){ tone(220,.2,"sine",.06); }
function countTone(n){ tone(300+n*60,.18,"sine",.12); }
function bloomSfx(){ if(!AC||!soundOn)return; const o=AC.createOscillator(),g=AC.createGain(),st=AC.currentTime; o.type="sine"; o.frequency.setValueAtTime(400,st); o.frequency.exponentialRampToValueAtTime(1200,st+.4); g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(.1,st+.04); g.gain.exponentialRampToValueAtTime(.0001,st+.45); o.connect(g); g.connect(filter); o.start(st); o.stop(st+.5); }
function petSfx(kind){ const m={Bunny:[660,.1],Fox:[520,.14],Cat:[700,.12],Puppy:[300,.16]}[kind]||[600,.12]; tone(m[0],m[1],"triangle",.12); tone(m[0]*1.3,m[1],"triangle",.08,.08); }

/* ---------- voice (speechSynthesis) ---------- */
const Voice=(()=>{ let voice=null, q=[], speaking=false, lastIdx={};
  function selectVoice(){ const vs=speechSynthesis.getVoices(); if(!vs.length)return null;
    const pref=["Samantha","Karen","Moira","Tessa","Google UK English Female","Google US English","Microsoft Aria","Microsoft Jenny"];
    for(const p of pref){ const v=vs.find(v=>v.name.indexOf(p)>=0); if(v)return v; }
    return vs.find(v=>/female/i.test(v.name)) || vs.find(v=>v.lang&&v.lang.indexOf("en")===0) || vs[0]; }
  function fill(t){ return t.replace(/\{name\}/g,child&&child.name?child.name:"friend").replace(/\{friend\}/g,child?friendName[child.pet]:"Pip").replace(/\{friend2\}/g,child&&child.friend2?child.friend2:"").replace(/\{color\}/g,child?child.favoriteColor.word:"green"); }
  function run(){ if(speaking||!q.length)return; const job=q.shift(); speaking=true;
    if(!("speechSynthesis" in window)||!soundOn){ showCap(job.text); setTimeout(()=>{speaking=false; if(job.cb)job.cb(); run();}, Math.min(4200,900+job.text.length*45)); return; }
    if(!voice)voice=selectVoice(); const parts=fill(job.text).split("...").map(s=>s.trim()).filter(Boolean); let i=0;
    showCap(fill(job.text));
    (function next(){ if(i>=parts.length){ hideCap(); speaking=false; if(job.cb)job.cb(); run(); return; }
      const chunk=parts[i++]; const u=new SpeechSynthesisUtterance(chunk); if(voice)u.voice=voice; u.rate=(child?child.voicePace:1)*(windingDown?0.82:1)*(job.ambient?0.9:1); u.pitch=child?child.voicePitch:1.15;
      let advanced=false; const adv=()=>{ if(advanced)return; advanced=true; setTimeout(next,150); };
      u.onend=adv; u.onerror=adv; setTimeout(adv, 1400+chunk.length*95); // watchdog: never permanently stall if onend doesn't fire
      try{speechSynthesis.speak(u);}catch(e){adv();} })();
  }
  return { speak(text,opt){ opt=opt||{}; if(opt.learning && child && child.muteLearningTalk)return (opt.cb&&opt.cb());
      if(opt.solo){ q=[]; try{speechSynthesis.cancel();}catch(e){} speaking=false; } q.push({text,cb:opt.cb,ambient:opt.ambient}); run(); },
    line(arr,opt){ if(!arr||!arr.length)return; let i; do{ i=Math.floor(Math.random()*arr.length);}while(arr.length>1&&i===lastIdx[arr]); lastIdx[arr]=i; this.speak(arr[i],opt); },
    warm(){ try{ speechSynthesis.getVoices(); }catch(e){} } };
})();
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=()=>Voice.warm(); }

function showCap(t){ const s=document.getElementById("say"); s.textContent=t; s.classList.add("show"); clearTimeout(capT); capT=setTimeout(()=>s.classList.remove("show"),Math.max(2600,t.length*55)); }

/* ============================================================

const S=document.getElementById("scene");
const avatarWrap=document.getElementById("avatarWrap"), companionWrap=document.getElementById("companionWrap");
const avShadow=document.getElementById("avShadow"), compShadow=document.getElementById("compShadow");
let av={x:240,y:284,face:1}, walk=null;          // avatar feet pos
function placeAvatar(bob){ const y=av.y+(bob||0); avatarWrap.setAttribute("transform",`translate(${av.x.toFixed(1)},${y.toFixed(1)}) scale(${av.face},1) translate(${-AV_ANCHOR[0]},${-AV_ANCHOR[1]})`);
  avShadow.setAttribute("cx",av.x); avShadow.setAttribute("cy",av.y+2); }
function placeCompanion(bob){ const cx=av.x+58, cy=av.y+4+(bob||0); companionWrap.setAttribute("transform",`translate(${cx.toFixed(1)},${cy.toFixed(1)}) translate(${-CO_ANCHOR[0]},${-CO_ANCHOR[1]})`);
  compShadow.setAttribute("cx",av.x+58); compShadow.setAttribute("cy",av.y+6); }
function renderAvatar(){ document.getElementById("avatar").innerHTML=avatar(child); document.getElementById("companion").innerHTML=companion(child.pet); }

function svgPoint(evt){ const pt=S.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY; const m=S.getScreenCTM(); return m?pt.matrixTransform(m.inverse()):{x:240,y:284}; }
function walkTo(x,y){ x=Math.max(34,Math.min(446,x)); y=Math.max(206,Math.min(322,y)); av.face=(x>=av.x?1:-1);
  if(REDUCE){ av.x=x; av.y=y; placeAvatar(); placeCompanion(); return; }
  const sx=av.x,sy=av.y, dist=Math.hypot(x-sx,y-sy), dur=Math.max(300,Math.min(820,dist*8)); walk={sx,sy,x,y,t:0,dur}; }
let bobT=0, idleClock=0, lastInteract=performance.now();
function loop(now){ const dt=16; bobT+=0.045;
  if(walk){ walk.t+=dt; let k=Math.min(1,walk.t/walk.dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    av.x=walk.sx+(walk.x-walk.sx)*e; av.y=walk.sy+(walk.y-walk.sy)*e; if(k>=1){ av.x=walk.x; av.y=walk.y; walk=null; squash(); } }
  const b=REDUCE?0:Math.sin(bobT)*2.2, b2=REDUCE?0:Math.sin(bobT+0.9)*2.4;
  placeAvatar(walk?0:b); placeCompanion(b2);
  if(place==="playground"&&playmates.length)updatePlaymates();
  // idle nudge
  if(state==="play"&&!activeActivity&&!walk){ if(now-lastInteract>26000){ lastInteract=now; Voice.line(LINES.idle,{ambient:true}); spawnButterfly(); } }
  requestAnimationFrame(loop);
}
let squashT=0;
function squash(){ if(REDUCE)return; const g=document.getElementById("avatar"); g.style.transition="transform .12s"; g.style.transformOrigin="110px 232px"; g.style.transform="scaleY(.94)"; setTimeout(()=>{g.style.transform="scaleY(1.02)"; setTimeout(()=>g.style.transform="",120);},120);
  companionHop(); }
function companionHop(){ if(REDUCE)return; const g=document.getElementById("companion"); g.style.transition="transform .15s"; g.style.transformOrigin="239px 240px"; g.style.transform="scale(1.08)"; setTimeout(()=>g.style.transform="",170); }

/* walk sparkle + particles */
function sparkleAt(x,y){ if(REDUCE)return; const fx=document.getElementById("fx"); const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.innerHTML=`<circle r="14" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle r="9" fill="none" stroke="var(--violet)" stroke-width="2"/><circle r="4" fill="none" stroke="var(--gold)" stroke-width="2"/>`+
    [0,60,120,180,240,300].map(a=>`<line x1="0" y1="0" x2="${Math.cos(a*Math.PI/180)*16}" y2="${Math.sin(a*Math.PI/180)*16}" stroke="var(--gold)" stroke-width="1.5"/>`).join("");
  g.setAttribute("transform",`translate(${x},${y}) scale(0.2)`); g.style.transition="transform .2s, opacity .35s"; g.style.opacity="1"; fx.appendChild(g);
  requestAnimationFrame(()=>g.setAttribute("transform",`translate(${x},${y}) scale(1)`)); setTimeout(()=>{g.style.opacity="0";},650); setTimeout(()=>g.remove(),1000); }
function burst(x,y,cols){ if(REDUCE)return; const fx=document.getElementById("fx"); for(let i=0;i<10;i++){ const p=document.createElementNS("http://www.w3.org/2000/svg","circle"); const a=Math.random()*6.28,d=14+Math.random()*22; p.setAttribute("r",2+Math.random()*2.5); p.setAttribute("fill",(cols||["#FBE08A","#A98BD6","#EF8FB8","#7FC889"])[i%4]); p.setAttribute("cx",x); p.setAttribute("cy",y); p.style.transition="transform .6s ease-out, opacity .6s"; fx.appendChild(p); requestAnimationFrame(()=>{ p.setAttribute("transform",`translate(${Math.cos(a)*d},${Math.sin(a)*d-10})`); p.style.opacity="0"; }); setTimeout(()=>p.remove(),650); } }

const SVGNS="http://www.w3.org/2000/svg";

const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
/* seeded RNG so every NPC kid looks the SAME each visit (they become familiar friends) */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
function randomKidState(seed){ const rnd=mulberry(((seed|0)*2654435761>>>0)||1); const p=a=>a[Math.floor(rnd()*a.length)];
  return {skin:p(skins),eye:p(eyeCols),freckles:p(freckOpt),glasses:(rnd()<0.18?(rnd()<0.5?"Round":"Square"):"None"),hairStyle:p(hairStyles),hairColor:p(hairCs),headwear:p(headOpt),outfit:p(outfits),shirt:p(shirts)}; } /* ~18% of kids wear glasses (was 2/3) */
const KID_NAMES=["Mia","Leo","Ava","Max","Zoe","Sam","Ivy","Ben","Lily","Theo"];
const kidName=seed=>KID_NAMES[seed%KID_NAMES.length];
/* a decorative kid <g>, positioned + scaled by feet anchor; CSS-bob lives on an OUTER wrapper so it can't clobber the position transform */
function kidNode(seed,x,y,scale,faceLeft,bob){ const wrap=document.createElementNS(SVGNS,"g");
  if(bob&&!REDUCE){ wrap.setAttribute("class","kidbob"); wrap.style.animationDelay=(((seed*0.37)%2.4)).toFixed(2)+"s"; wrap.style.animationDuration=(2.2+(seed%5)*0.28).toFixed(2)+"s"; }
  const inner=document.createElementNS(SVGNS,"g"); inner.setAttribute("transform",`translate(${x},${y}) scale(${faceLeft?-scale:scale},${scale}) translate(-110,-232)`); inner.innerHTML=avatar(randomKidState(seed)); wrap.appendChild(inner); wrap.dataset.kid=seed; return wrap; }
/* a generous invisible tap pad in #props (persists across clearActivity) */
function tapPad(x,y,r,onTap){ const c=document.createElementNS(SVGNS,"circle"); c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",r); c.setAttribute("fill","transparent"); c.style.cursor="pointer";
  c.addEventListener("pointerdown",e=>{ e.stopPropagation(); lastInteract=performance.now(); initAudio(); ripple(+c.getAttribute("cx"),+c.getAttribute("cy")); onTap(e); }); PROPS.appendChild(c); return c; }
function clearProps(){ PROPS.innerHTML=""; }
/* expanding touch ring — makes it clear WHERE the finger landed (kid-feedback) */
function ripple(x,y){ if(REDUCE)return; const fx=document.getElementById("fx"); const c=document.createElementNS(SVGNS,"circle"); c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",7); c.setAttribute("fill","none"); c.setAttribute("stroke","var(--accent)"); c.setAttribute("stroke-width","3"); c.style.transition="transform .42s ease-out, opacity .42s"; c.style.transformBox="fill-box"; c.style.transformOrigin="center"; fx.appendChild(c); requestAnimationFrame(()=>{ c.style.transform="scale(3.6)"; c.style.opacity="0"; }); setTimeout(()=>c.remove(),460); }
/* kid reaction — cycles wave / giggle / play, never nags */
let kidGreetIdx=0;
function kidReact(node,name,px,py){ if(node){ const inner=node.firstChild||node; inner.style.transition="transform .18s"; inner.style.transformBox="fill-box"; inner.style.transformOrigin="bottom center"; inner.style.transform="translateY(-8px)"; setTimeout(()=>{inner.style.transform="";},200); }
  const acts=[ ()=>{ tone(560,.12,"sine",.1); tone(720,.12,"sine",.08,.09); Voice.speak(`Hi {name}! I'm ${name}!`,{solo:true}); },
               ()=>{ tone(700,.09,"triangle",.09); tone(840,.09,"triangle",.07,.07); Voice.speak("Hee hee hee!",{solo:true}); },
               ()=>{ tone(620,.12,"sine",.1); Voice.speak("Wanna play, {name}?",{solo:true}); } ];
  acts[kidGreetIdx++%acts.length](); sparkleAt(px,py-6); }

/* ---- COUNT-AND-FIND (school: recognise a numeral, then collect that many) ---- */

function startCountFind(){ clearActivity(); const L=ageLevel(); const addition=L>=4;  /* ages 7-8 do simple ADDITION */

  Voice.speak(addition?`Let's add, {name}! What is ${a} plus ${b}?`:`Let's count, {name}! Can you find the number ${target}?`,{learning:true});
  function scaffold1(){ const t=pebbles.find(p=>+p.dataset.nu===target); if(t)haloOn(t); }
  function resetIdle1(){ clearTimeout(idle1); idle1=setTimeout(()=>{ scaffold1(); Voice.speak(`Find the number ${target}!`,{learning:true}); },7000); }
  resetIdle1();
  function choose(g){ lastInteract=performance.now(); if(step2)return; const tr=g.getAttribute("transform").match(/translate\(([-\d.]+),([-\d.]+)\)/),gx=+tr[1],gy=+tr[2];
    if(+g.dataset.nu===target){ step2=true; clearTimeout(idle1); pebblePop(g,"translateY(-9px) scale(1.15)"); tone(520,.18,"sine",.12); sparkleAt(gx,gy); Voice.speak(`Yes! ${target}!`,{learning:true,solo:true}); setTimeout(beginCount,750); }
    else { resetIdle1(); pebblePop(g,"scale(1.08)"); setTimeout(()=>pebblePop(g,""),180); tone(300,.12,"sine",.06); Voice.speak(`That's ${g.dataset.nu}. We want ${target}!`,{learning:true,solo:true}); scaffold1(); } }

    for(let i=0;i<target;i++){ const [x,y]=spotFor(i,target); const g=document.createElementNS(SVGNS,"g"); g.setAttribute("transform",`translate(${x},${y})`); g.style.cursor="pointer"; g.dataset.thing="1";
      g.innerHTML=`<g class="peb">${drawObject(word)}</g>`; A.appendChild(g); things.push(g); }
    Voice.speak(`Now let's find ${target}! Tap each one and count!`,{learning:true});
    let idle2; function resetIdle2(){ clearTimeout(idle2); idle2=setTimeout(auto,8000); }

const tapLayer=document.getElementById("tapLayer");
tapLayer.addEventListener("pointerdown",e=>{ if(state!=="play"||windingDown)return; lastInteract=performance.now(); initAudio(); Voice.warm();
  const p=svgPoint(e); if(p.y<200){ /* tapped sky -> gentle nudge to walk on grass */ walkTo(p.x,Math.max(210,p.y)); } else { walkTo(p.x,p.y); } sparkleAt(p.x,Math.max(206,p.y)); });
document.getElementById("companionWrap").addEventListener("pointerdown",e=>{ e.stopPropagation(); initAudio(); lastInteract=performance.now(); companionHop(); if(state==="play"&&!activeActivity&&!windingDown)Voice.line(LINES.greeting,{}); });
document.querySelectorAll("#places .travel").forEach(b=>b.addEventListener("pointerdown",e=>{ e.stopPropagation(); goPlace(b.dataset.place); }));

function startPlay(){ state="play"; setup.classList.remove("show"); renderAvatar(); drawBlooms(); if(progress.nameSignpostPlanted)plantSignpost((child.name||"You").replace(/[^A-Za-z]/g,"").slice(0,8));
  applyAccent();
  // daily-delight hook
  const today=new Date().toDateString();
  if(progress.lastVisit && progress.lastVisit!==today){ setTimeout(()=>{ Voice.line(LINES.daily,{ambient:true}); spawnButterfly(); if(progress.bloomedFlowers.length<3)bloomFlower([0,1,2].find(i=>progress.bloomedFlowers.indexOf(i)<0)); },1400); }
  progress.lastVisit=today; progress.totalSessions=(progress.totalSessions||0)+1; saveProgress();
  spawnButterfly();
  setTimeout(()=>offerActivity(),1800);
}
function doReveal(){ saveChild(); setup.classList.remove("show"); renderAvatar(); applyAccent(); drawBlooms(); state="reveal";
  initAudio(); chimeUp(); burst(av.x,av.y-40);
  Voice.line(LINES.reveal,{solo:true,cb:()=>startPlay()});
  // safety: always advance even if voice fails
  setTimeout(()=>{ if(state==="reveal")startPlay(); }, 6000);
}
function applyAccent(){ document.documentElement.style.setProperty("--accent", (child.favoriteColor&&child.favoriteColor.hex)||shirts[2]); }

/* ============================================================
   SETUP FLOW (5 cards)
   ============================================================ */
const setup=document.getElementById("setup"), setupCard=document.getElementById("setupCard");
let qi=0, tmp=null;
function startSetup(){ tmp=defaultChild(); setup.classList.add("show"); qi=0; renderQ(); }
function miniScene(inner){ return `<svg class="scene-mini" viewBox="0 0 240 150" style="width:100%"><rect width="240" height="150" fill="none"/><g transform="translate(50,-78) scale(.62)">${inner}</g></svg>`; }
function renderQ(){
  child=child||tmp;
  if(qi===0){ // NAME
    setupCard.innerHTML=`<h2>✨ Let's begin ✨</h2><div class="sub">Type your child's name</div>
      <div class="nameField"><input id="nm" type="text" maxlength="14" placeholder="Name" value="${tmp.name||""}"></div>
      <div class="sub">A friend or sibling's name? <span style="color:#bdb8cf">(optional)</span></div>
      <div class="nameField"><input id="nm2" type="text" maxlength="14" placeholder="(optional)" value="${tmp.friend2||""}"></div>
      <button class="go" id="next" ${tmp.name?"":"disabled"}>Next →</button>
      <div class="micro">Just a name — it never leaves this tablet.</div>`;
    const nm=document.getElementById("nm"); nm.addEventListener("input",()=>{ tmp.name=nm.value.trim().replace(/^./,c=>c.toUpperCase()); document.getElementById("next").disabled=!tmp.name; });
    document.getElementById("nm2").addEventListener("input",e=>tmp.friend2=e.target.value.trim().replace(/^./,c=>c.toUpperCase()));
    document.getElementById("next").onclick=()=>{ initAudio(); Voice.warm(); go(1); };
  } else if(qi===1){ // LOOK
    setupCard.innerHTML=`<h2>Now let's make YOU!</h2>
      <svg id="miniSvg" class="scene-mini" viewBox="44 34 132 210" preserveAspectRatio="xMidYMid meet" style="height:200px;display:block;margin:0 auto 10px"><g id="mAv"></g></svg>
      <div class="row"><span class="label">Skin</span><div class="opts" id="skinO"></div></div>
      <div class="row"><span class="label">Eyes</span><div class="opts" id="eyeO"></div></div>
      <div class="row"><span class="label">Hair</span><div class="opts" id="hairO"></div></div>
      <div class="row"><span class="label">Color</span><div class="opts" id="hcO"></div></div>
      <div class="row"><span class="label">Outfit</span><div class="opts" id="outO"></div></div>
      <div class="row"><span class="label">Extras</span><div class="opts" id="exO"></div></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:6px"><button class="pill" id="dice" style="background:var(--gold);color:#5b4500">🎲 Surprise me</button><button class="pill" id="resetLook">↺ Reset</button></div>
      <button class="go" id="next">Next →</button><div class="micro">There's no wrong way to look.</div>`;
    const upd=()=>{ const g=document.getElementById("mAv"); g.innerHTML=avatar(tmp); try{ const bb=g.getBBox(); document.getElementById("miniSvg").setAttribute("viewBox",`${(bb.x-10).toFixed(0)} ${(bb.y-10).toFixed(0)} ${(bb.width+20).toFixed(0)} ${(bb.height+20).toFixed(0)}`); }catch(e){} }; // auto-frame to the avatar's real bbox so the head is never clipped
    sw("skinO",skins,"skin",upd); sw("eyeO",eyeCols,"eye",upd); pl("hairO",hairStyles,"hairStyle",upd); sw("hcO",hairCs,"hairColor",upd); pl("outO",outfits,"outfit",upd);
    pl("exO",["None","Round","Square"],"glasses",upd);
    document.getElementById("dice").onclick=()=>{ tmp.skin=pick(skins);tmp.eye=pick(eyeCols);tmp.hairStyle=pick(hairStyles);tmp.hairColor=pick(hairCs);tmp.outfit=pick(outfits);tmp.shirt=pick(shirts);tmp.glasses=pick(glassesOpt);tmp.freckles=pick(freckOpt);tmp.headwear=pick(headOpt); renderQ(); };
    document.getElementById("resetLook").onclick=()=>{ const d=defaultChild(); ["skin","eye","freckles","glasses","hairStyle","hairColor","headwear","outfit","shirt"].forEach(k=>tmp[k]=d[k]); renderQ(); }; // reset the look to default
    upd(); document.getElementById("next").onclick=()=>go(2);
  } else if(qi===2){ // FRIEND
    setupCard.innerHTML=`<h2>Pick your animal friend</h2><div class="opts" id="petO" style="gap:14px"></div>
      <button class="go" id="next">Next →</button><div class="micro">Your friend will say your name and play with you.</div>`;
    const box=document.getElementById("petO");
    pets.forEach(p=>{ const d=document.createElement("div"); d.className="big-pick"+(tmp.pet===p?" sel":"");
      d.innerHTML=`<svg viewBox="152 152 64 94" width="70" height="84">${companion(p).replace('translate(60,4)','translate(0,0)')}</svg><div style="font-weight:700;font-size:12px;color:#6f6a85">${friendName[p]}</div>`;
      d.onclick=()=>{ tmp.pet=p; initAudio(); petSfx(p); renderQ(); }; box.appendChild(d); });
    document.getElementById("next").onclick=()=>go(3);
  } else if(qi===3){ // COLOR
    setupCard.innerHTML=`<h2>What's your favorite color?</h2><div class="opts" id="colO" style="gap:14px;margin:16px 0"></div>
      <button class="go" id="next">Next →</button><div class="micro">Tap it and watch your meadow change!</div>`;
    const box=document.getElementById("colO");
    shirts.forEach((hex,i)=>{ const d=document.createElement("div"); d.className="colorblob"+(tmp.favoriteColor.word===colorWords[i]?" sel":""); d.style.background=hex;
      d.onclick=()=>{ tmp.favoriteColor={word:colorWords[i],hex}; document.documentElement.style.setProperty("--accent",hex); initAudio(); tone(523,.2,"sine",.12); renderQ(); }; box.appendChild(d); });
    document.getElementById("next").onclick=()=>go(4);
  } else { // AGE
    setupCard.innerHTML=`<h2>One last thing</h2><div class="sub">How old is your little one?<br>(sets the gentle pace)</div>
      <div class="opts" id="ageO" style="gap:14px;margin:16px 0"></div>
      <button class="go" id="next">🌳 To the meadow!</button>`;
    const box=document.getElementById("ageO");
    [3,4,5,6,7,8].forEach(a=>{ const d=document.createElement("button"); d.className="pill"+(tmp.age===a?" sel":""); d.style.fontSize="18px"; d.style.padding="11px 15px"; d.textContent="🌱 "+a;
      d.onclick=()=>{ tmp.age=a; renderQ(); }; box.appendChild(d); });
    document.getElementById("next").onclick=()=>{ child=tmp; doReveal(); };
  }
  // "← Back" on every step after the first — wraps the primary button in a row, state persists in tmp
  if(qi>0){ const nx=document.getElementById("next"); if(nx&&nx.parentNode){ const row=document.createElement("div"); row.style.cssText="display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px";
    const back=document.createElement("button"); back.className="pill"; back.textContent="← Back"; back.onclick=()=>go(qi-1);
    nx.parentNode.insertBefore(row,nx); row.appendChild(back); row.appendChild(nx); nx.style.marginTop="0"; } }
}
function go(n){ qi=n; renderQ(); }
function sw(id,arr,key,cb){ const b=document.getElementById(id); b.innerHTML=""; arr.forEach(c=>{ const s=document.createElement("div"); s.className="sw"+(tmp[key]===c?" sel":""); s.style.background=c; s.onclick=()=>{tmp[key]=c; b.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel")); s.classList.add("sel"); cb&&cb();}; b.appendChild(s); }); }
function pl(id,arr,key,cb){ const b=document.getElementById(id); b.innerHTML=""; arr.forEach(v=>{ const s=document.createElement("button"); s.className="pill"+(tmp[key]===v?" sel":""); s.textContent=v; s.onclick=()=>{tmp[key]=v; b.querySelectorAll(".pill").forEach(x=>x.classList.remove("sel")); s.classList.add("sel"); cb&&cb();}; b.appendChild(s); }); }

/* ============================================================
   TOOLS: play-again, mute, grown-up gate + corner, wind-down
   ============================================================ */
document.getElementById("playAgain").onclick=()=>{ initAudio(); lastInteract=performance.now(); if(windingDown){ windingDown=false; document.getElementById("skyTop").setAttribute("stop-color","#C3E7F8"); document.getElementById("stars").setAttribute("opacity","0"); }
  if(state==="play"&&!activeActivity)offerActivity(); else if(state==="play")Voice.line(LINES.encourage,{}); };
let muteHold=null;
const muteDot=document.getElementById("muteDot");
muteDot.addEventListener("pointerdown",()=>{ muteHold=setTimeout(()=>{ soundOn=!soundOn; muteDot.textContent=soundOn?"🔊":"🔇"; if(!soundOn&&"speechSynthesis"in window)speechSynthesis.cancel(); },600); });
["pointerup","pointerleave","pointercancel"].forEach(ev=>muteDot.addEventListener(ev,()=>clearTimeout(muteHold)));

/* parental gate */
const gate=document.getElementById("gate"), grownup=document.getElementById("grownup"), gAnchor=document.getElementById("gAnchor");
let gateHold=null;
gAnchor.addEventListener("pointerdown",()=>{ gateHold=setTimeout(openGate,2000); });
["pointerup","pointerleave","pointercancel"].forEach(ev=>gAnchor.addEventListener(ev,()=>clearTimeout(gateHold)));
function openGate(){ const target=3; document.getElementById("gateTarget").textContent=target; const nums=[3,5,8].sort(()=>Math.random()-0.5);
  const box=document.getElementById("gateNums"); box.innerHTML=""; nums.forEach(n=>{ const b=document.createElement("button"); b.className="gnum"; b.textContent=n; b.onclick=()=>{ if(n===target){ gate.classList.remove("show"); openCorner(); } else openGate(); }; box.appendChild(b); }); gate.classList.add("show"); }
function openCorner(){ grownup.classList.add("show");
  const seg=(id,arr,key,fmt)=>{ const b=document.getElementById(id); b.innerHTML=""; arr.forEach(v=>{ const s=document.createElement("button"); s.className="pill"+(child[key]===v?" sel":""); s.textContent=fmt?fmt(v):v; s.onclick=()=>{ child[key]=v; saveChild(); b.querySelectorAll(".pill").forEach(x=>x.classList.remove("sel")); s.classList.add("sel"); }; b.appendChild(s); }); };
  seg("gAge",[3,4,5,6,7,8],"age"); seg("gPace",[0.9,1.0,1.2],"voicePace",v=>({0.9:"🐢",1.0:"🚶",1.2:"🐇"}[v])); seg("gWind",[5,10,15],"windDownMinutes",v=>v+"m");
  const mt=document.getElementById("gMute"); mt.className="toggle"+(child.muteLearningTalk?" on":""); mt.onclick=()=>{ child.muteLearningTalk=!child.muteLearningTalk; mt.className="toggle"+(child.muteLearningTalk?" on":""); saveChild(); };
}
document.getElementById("gClose").onclick=()=>grownup.classList.remove("show");
document.getElementById("gWindNow").onclick=()=>{ grownup.classList.remove("show"); startWindDown(); };
document.getElementById("gReset").onclick=()=>{ if(confirm("Start over? This clears the saved meadow.")){ try{localStorage.removeItem("oncePuponAYou.child"); localStorage.removeItem("oncePuponAYou.progress");}catch(e){} location.reload(); } };
document.getElementById("gShare").onclick=()=>{ const n=child.name||"my child"; const t=`${n}'s Meadow — a little learning game I made for ${n} ✨`;
  if(navigator.share){ navigator.share({title:"Once Upon a You",text:t,url:location.href}).catch(()=>{}); } else { try{ navigator.clipboard.writeText(t+" "+location.href); alert("Copied a link to share!"); }catch(e){ alert(location.href); } } };

/* wind-down */
let windTimer=null;
function armWindTimer(){ clearTimeout(windTimer); if(child&&child.windDownMinutes)windTimer=setTimeout(startWindDown, child.windDownMinutes*60000); }
function startWindDown(){ if(windingDown)return; windingDown=true; clearActivity(); state="play";
  document.getElementById("skyTop").setAttribute("stop-color","#E8D9EA"); document.getElementById("stage").style.transition="opacity 1.2s";
  const stars=document.getElementById("stars"); stars.innerHTML=""; for(let i=0;i<10;i++){ const x=Math.random()*460+10,y=Math.random()*120+20; stars.innerHTML+=`<circle cx="${x}" cy="${y}" r="${1.4+Math.random()*1.6}" fill="#FBE08A"/>`; }
  stars.style.transition="opacity 2s"; stars.setAttribute("opacity","1");
  Voice.line(LINES.windDown,{solo:true}); }

/* ============================================================
   PWA (offline + installable) — inline manifest + blob SW
   ============================================================ */
(function(){ try{
  const icon="data:image/svg+xml;base64,"+btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C3E7F8"/><stop offset="1" stop-color="#98CE6F"/></linearGradient></defs><rect width="192" height="192" rx="40" fill="url(#g)"/><circle cx="60" cy="56" r="22" fill="#FBDE7E"/><text x="96" y="150" font-size="70" text-anchor="middle">🦊</text><text x="150" y="60" font-size="40" text-anchor="middle">✨</text></svg>`);
  const man={name:"Once Upon a You",short_name:"Once Upon a You",description:"A gentle, no-fail learning meadow starring your child.",start_url:".",display:"standalone",orientation:"any",background_color:"#EAF6FB",theme_color:"#6B5BD2",icons:[{src:icon,sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const ml=document.createElement("link"); ml.rel="manifest"; ml.href="data:application/json;base64,"+btoa(unescape(encodeURIComponent(JSON.stringify(man)))); document.head.appendChild(ml);
  const ai=document.createElement("link"); ai.rel="apple-touch-icon"; ai.href=icon; document.head.appendChild(ai);
  if("serviceWorker" in navigator){ const sw=`const C="oua-v3";self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil((async()=>{const ks=await caches.keys();await Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)));await self.clients.claim()})())});self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;e.respondWith((async()=>{try{const resp=await fetch(e.request);if(resp&&resp.ok){const cp=resp.clone();caches.open(C).then(c=>c.put(e.request,cp))}return resp}catch(err){const m=await caches.match(e.request);return m||Response.error()}})())});`;
    const url=URL.createObjectURL(new Blob([sw],{type:"text/javascript"})); navigator.serviceWorker.register(url).catch(()=>{}); }
}catch(e){} })();

/* ============================================================
   BOOT
   ============================================================ */
requestAnimationFrame(loop);
window.addEventListener("pointerdown",function warm(){ initAudio(); Voice.warm(); armWindTimer(); window.removeEventListener("pointerdown",warm); },{once:true});
document.addEventListener("pointerdown",()=>{ lastInteract=performance.now(); armWindTimer(); });
if(child && child.name){ /* returning */ renderAvatar(); applyAccent(); drawBlooms(); state="reveal"; setTimeout(()=>{ initAudio(); Voice.line(LINES.greeting,{solo:true,cb:()=>startPlay()}); setTimeout(()=>{ if(state==="reveal")startPlay(); },5000); },400); }
else { startSetup(); }

/* expose for headless verification */
window.__OUY={ get child(){return child;}, get progress(){return progress;}, get state(){return state;}, get place(){return place;}, get av(){return av;}, walkTo, goPlace, offerActivity, startSoundHunt, startBerryCount, startMyName, startLetterGarden, startCountFind, startShapeHunt, startColorMatch, startAnimalSounds, startMemoryMatch, finishActivity, doReveal, startSetup, go, setTmp(o){Object.assign(tmp||(tmp=defaultChild()),o);}, get tmp(){return tmp;}, startWindDown, openGate,
  tick:(n)=>loop(n||performance.now()), get walking(){return !!walk;} };
</script>
</body>
